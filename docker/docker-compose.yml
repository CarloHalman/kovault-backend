# Kovault stack (compose project `kovault`): two containers, grouped together.
#   kovault-db   — PostgreSQL + pgvector + pg_search + pg_trgm
#   kovault-mcp  — the MCP server (../mcp-server); only it holds DB credentials
# The embedding model is a SEPARATE, reusable service — see ../embedding/. kovault-mcp calls
# whatever URL is in the `embedding` DB setting (02-init.sql); the default
# http://embedding:11434 reaches the bundled service over the shared kovault-net, with no host
# port anywhere. It can equally be an existing Ollama or any OpenAI-compatible endpoint elsewhere.
#
# EXPOSURE: every published port below is bound to ${KOVAULT_BIND}, which defaults to 127.0.0.1 —
# nothing is reachable off this machine until you say so in .env (see .env.example). The
# in-container listeners stay on 0.0.0.0, which is the container's own interface and says nothing
# about host exposure. Anything past loopback needs KOVAULT_AUTH_TOKEN set (B2).
name: kovault

services:
  kovault-db:
    # No container_name on purpose. A container_name is global to the host, so pinning one makes a
    # second stack collide no matter what `-p` project name you pass. Compose derives the name from
    # the project instead (kovault-kovault-db-1 by default). Other services still reach this one as
    # `kovault-db`, the service key, which is the network alias.
    restart: unless-stopped         # returns after a host reboot
    build:
      context: .
      dockerfile: Dockerfile
    command: postgres -c shared_preload_libraries=pg_search,pg_cron   # pg_cron required by paradedb image bootstrap; add ',age' only if AGE is re-added
    environment:
      POSTGRES_DB: kovault
      POSTGRES_USER: kovault
      POSTGRES_PASSWORD_FILE: /run/secrets/kovault_db_password
    ports:
      - "${KOVAULT_BIND:-127.0.0.1}:5433:5432"   # host DB port (pgAdmin/debug only); change 5433 if taken
    volumes:
      - kovault-data:/var/lib/postgresql/data
    networks:
      - kovault-net
    secrets:
      - kovault_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovault -d kovault"]
      interval: 5s
      timeout: 5s
      retries: 20

  kovault-mcp:
    # No container_name — same reason as kovault-db above. Reachable as `kovault-mcp` on the
    # network either way, since that is the service key.
    restart: unless-stopped
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    depends_on:
      kovault-db:
        condition: service_healthy
    environment:
      # Only the MCP server knows the DB DSN. Password comes from the same secret file.
      KOVAULT_DB_HOST: kovault-db
      KOVAULT_DB_PORT: "5432"
      KOVAULT_DB_NAME: kovault
      KOVAULT_DB_USER: kovault
      KOVAULT_DB_PASSWORD_FILE: /run/secrets/kovault_db_password
      # Shared bearer token guarding EVERY route (/mcp, /export, /relocate-sources, /page-meta,
      # /debug-log). Comma-separate several to rotate without downtime. An empty file runs the
      # server open — it starts, and says so in capitals at every boot.
      KOVAULT_AUTH_TOKEN_FILE: /run/secrets/kovault_auth_token
      KOVAULT_MCP_HOST: 0.0.0.0
      KOVAULT_MCP_PORT: "8000"
    extra_hosts:
      # kept for the case where you point `embedding` at something running on the HOST rather
      # than at the bundled service on kovault-net; harmless otherwise
      - "host.docker.internal:host-gateway"
    ports:
      - "${KOVAULT_BIND:-127.0.0.1}:8000:8000"   # the HTTP endpoint users' plugins connect to
    networks:
      - kovault-net
    secrets:
      - kovault_db_password
      - kovault_auth_token

volumes:
  kovault-data:

networks:
  # Shared with the `embedding` project (../embedding/docker-compose.yml) so kovault-mcp reaches
  # http://embedding:11434 with no host port on the embedder. External so neither project has to
  # start before the other — create it once:  docker network create kovault-net
  kovault-net:
    external: true

secrets:
  kovault_db_password:
    file: ./secrets/kovault_db_password.txt   # openssl rand -base64 32 > this file, never the .example
  kovault_auth_token:
    # openssl rand -base64 32 > this file. Never copy the .example one into place, it is a placeholder.
    # UPGRADING: this file must EXIST or compose refuses to start the stack. `touch` it to keep
    # the pre-1.5.0 open behaviour, then add a token when you are ready.
    file: ./secrets/kovault_auth_token.txt
